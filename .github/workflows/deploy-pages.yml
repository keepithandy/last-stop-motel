name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Rebuild the playable game from source
        working-directory: SOURCE
        run: |
          npm ci
          npm run build
          npm test

      - name: Prepare the playable site from tested output
        run: |
          mkdir _site
          cp -R SOURCE/dist/. _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy the game
        id: deployment
        uses: actions/deploy-pages@v4
