name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6

      - name: Prepare the playable site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy the game
        id: deployment
        uses: actions/deploy-pages@v4
